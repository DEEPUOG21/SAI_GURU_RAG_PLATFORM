[project]
name = "sai-guru"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "pgvector>=0.5.1,<1",
  "alembic>=1.14,<2", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "pypdf>=5,<7",
  "python-docx>=1.1,<2", "beautifulsoup4>=4.12,<5", "sqlglot>=26,<30",
  "langgraph>=1.0,<2", "langsmith>=0.4,<1"
]
[project.optional-dependencies]
local = ["fastembed>=0.6,<1"]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.9,<1", "pytest-cov>=7,<8"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a migrated PostgreSQL database"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
