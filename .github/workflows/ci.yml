name: Validate Sai Guru
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security.yml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: sai
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sai_guru_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sai -d sai_guru_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://sai:test-only-password@localhost:5432/sai_guru_test
      SAI_INTEGRATION: '1'
      JWT_SECRET: ci-only-signing-key-for-disposable-integration-tests-2026
      FASTEMBED_CACHE_PATH: /tmp/fastembed
      HF_HOME: /tmp/huggingface
      RUNTIME_DATABASE_PASSWORD: ci-runtime-only-not-production-1234567890
      TEST_RUNTIME_DATABASE_URL: postgresql+asyncpg://sai_runtime:ci-runtime-only-not-production-1234567890@localhost:5432/sai_guru_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock && pip install -e './backend[dev,local]'
      - run: python scripts/check_repository.py
      - run: ruff check backend
      - run: alembic -c backend/alembic.ini upgrade head
      - run: python -m app.database.setup_runtime
      - run: pytest backend/tests -q
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f backend/Dockerfile -t sai-guru-api .
      - name: Verify non-root runtime and isolated parser
        run: |
          docker run --rm -i --entrypoint python sai-guru-api - <<'PY'
          import asyncio
          import os
          import sys
          import onnxruntime
          from app.ingestion.sandbox import parse_isolated

          assert sys.version_info[:2] == (3, 11)
          assert os.getuid() == 10001
          assert "CPUExecutionProvider" in onnxruntime.get_available_providers()
          sections = asyncio.run(parse_isolated("Runtime-check.md", b"# Runtime\n\nParser isolation works."))
          assert sections and "Parser isolation works." in sections[0].text
          print("Python 3.11, non-root native runtime, and isolated parsing passed.")
          PY
      - run: docker build -f frontend/Dockerfile -t sai-guru-web .
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_DEPLOYMENT == 'true'
    needs: [frontend, backend, containers, security]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Trigger configured Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK" > /dev/null
      # Vercel deploys through its GitHub integration; configure production branch main.
