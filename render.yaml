services:
  - type: web
    name: sai-guru-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GENERATION_MODE
        value: llm
      - key: SQL_DATABASE_URL
        sync: false
      - key: LLM_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: http
      - key: RERANKER_PROVIDER
        value: http
      - key: EMBEDDING_URL
        sync: false
      - key: RERANKER_URL
        sync: false
      - key: INFERENCE_API_KEY
        sync: false
